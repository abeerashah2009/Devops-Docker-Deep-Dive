services:
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    image: cicd-lab:1.0
    build: .
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  test:
    image: cicd-lab:1.0
    build: .
    command: ["pytest", "-q", "test_app.py"]
    depends_on:
      redis:
        condition: service_healthy
